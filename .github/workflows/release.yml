# Release: a tag v* builds the studio for every platform, checks it and publishes a GitHub Release.
# Subscribers install the latest release with one command (see README).
name: release

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon
            target: mac-arm64
          - os: macos-15-intel # Intel (GitHub keeps it until August 2027)
            target: mac-x64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Installer defaults and update preservation
        run: node --test tools/setup.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test — a shader and a mockup render (also fetches Remotion's browser into the release)
        run: node node_modules/tsx/dist/cli.mjs tools/smoke.ts

      - name: Package
        run: node tools/package.mjs ${{ matrix.target }}

      - name: Verify extracted package and generate checksum
        run: node tools/verify-package.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: moootion-${{ matrix.target }}
          path: |
            dist/moootion-*
            dist/install.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable package version');
          const tag = 'v' + version;
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF !== 'refs/tags/' + tag) throw new Error('Tag does not match package version');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'tag=' + tag + '\n');
          NODE
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Moootion ${{ steps.version.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
