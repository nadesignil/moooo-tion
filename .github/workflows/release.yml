# Release: a tag v* builds the studio for every platform, checks it and publishes a GitHub Release.
# Subscribers install the latest release with one command (see README).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15 # Apple Silicon
            target: mac-arm64
          - os: macos-15-intel # Intel (GitHub keeps it until August 2027)
            target: mac-x64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test — a shader and a mockup render (also fetches Remotion's browser into the release)
        run: node node_modules/tsx/dist/cli.mjs tools/smoke.ts

      - name: Package
        run: node tools/package.mjs ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: moootion-${{ matrix.target }}
          path: |
            dist/moootion-*
            dist/install.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
